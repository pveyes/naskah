name: build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Run tests
        run: cargo test --workspace --verbose

  demo:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/static/package-lock.json
      - uses: Swatinem/rust-cache@v2
      # A prebuilt wasm-pack, so build-demo.sh does not compile it from source.
      - uses: jetli/wasm-pack-action@v0.4.0
      - name: Build the wasm demo
        run: ./scripts/build-demo.sh
      - name: Install the cf CLI
        working-directory: demo/static
        run: npm ci --no-audit --no-fund
      # Builds the site and checks the deploy without uploading, so it also runs
      # for pull requests that cannot see the Cloudflare secrets.
      - name: Check the deploy
        working-directory: demo/static
        run: npx --no-install cf deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Keep the wasm build for the deploy
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: demo/static/assets
          retention-days: 1

  # A separate job so that only pushes to master show up under "Deployments".
  deploy:
    needs: demo
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://naskah.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/static/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: wasm
          path: demo/static/assets
      - name: Install the cf CLI
        working-directory: demo/static
        run: npm ci --no-audit --no-fund
      - name: Deploy to Cloudflare
        working-directory: demo/static
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets so pushes to master can deploy."
            exit 1
          fi
          npx --no-install cf deploy
